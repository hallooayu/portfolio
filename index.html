    function usePrefersReducedMotion() {
      const [reduced, setReduced] = useState(false);
      useEffect(() => {
        const mq = window.matchMedia("(prefers-reduced-motion: reduce)");
        setReduced(mq.matches);
        const handler = () => setReduced(mq.matches);
        mq.addEventListener ? mq.addEventListener("change", handler) : mq.addListener(handler);
        return () => mq.removeEventListener ? mq.removeEventListener("change", handler) : mq.removeListener(handler);
      }, []);
      return reduced;
    }

    function useInView(threshold = 0.15) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) { setVisible(true); obs.unobserve(el); }
        }, { threshold });
        obs.observe(el);
        return () => obs.disconnect();
      }, [threshold]);
      return [ref, visible];
    }

    function useCountUp(target, active, duration = 1300) {
      const [value, setValue] = useState(0);
      useEffect(() => {
        if (!active) return;
        let raf;
        const start = performance.now();
        const tick = (now) => {
          const p = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - p, 3);
          setValue(target * eased);
          if (p < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => raf && cancelAnimationFrame(raf);
      }, [active, target, duration]);
      return value;
    }

    function useScrollProgress() {
      const [progress, setProgress] = useState(0);
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        let ticking = false;
        const onScroll = () => {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(() => {
            const doc = document.documentElement;
            const top = doc.scrollTop || document.body.scrollTop;
            const height = doc.scrollHeight - doc.clientHeight;
            setProgress(height > 0 ? (top / height) * 100 : 0);
            setScrolled(top > 20);
            ticking = false;
          });
        };
        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();
        return () => window.removeEventListener("scroll", onScroll);
      }, []);
      return { progress, scrolled };
    }

    /* =========================================================================
       PLANETARY VORTEX STARDUST & AMBIENT SHOOTING STARS CANVAS
    ========================================================================= */
    function GalaxyStarsCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        let mouse = { x: -1000, y: -1000 };
        const handleMouseMove = (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        };
        const handleMouseLeave = () => {
          mouse.x = -1000;
          mouse.y = -1000;
        };
        window.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseleave', handleMouseLeave);

        // Pure white interstellar stardust & ambient shooting stars
        const starCount = Math.floor((width * height) / 4500); 
        const stars = [];
        const shootingStars = [];

        for (let i = 0; i < starCount; i++) {
          const baseRadius = Math.random() * 1.8 + 0.3;
          stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: baseRadius,
            originalRadius: baseRadius,
            angle: Math.random() * Math.PI * 2,
            distance: Math.random() * Math.max(width, height) * 0.5,
            speed: Math.random() * 0.0008 + 0.0002, // Planetary spinning vortex speed
            pulseSpeed: Math.random() * 0.04 + 0.01,
            pulseOffset: Math.random() * 10,
            alpha: Math.random() * 0.7 + 0.2
          });
        }

        // Ambient automatic shooting stars
        for (let i = 0; i < 3; i++) {
          shootingStars.push({
            x: Math.random() * width,
            y: Math.random() * height * 0.5,
            length: Math.random() * 120 + 60,
            speed: Math.random() * 6 + 4,
            angle: Math.PI / 4 + (Math.random() - 0.5) * 0.2,
            opacity: Math.random()
          });
        }

        let time = 0;
        const render = () => {
          time += 0.02;
          ctx.clearRect(0, 0, width, height);

          const centerX = width / 2;
          const centerY = height / 2;

          // Update & render spinning white stardust (planetary vortex)
          stars.forEach((s) => {
            s.angle += s.speed;
            // Elliptical orbital motion around center
            s.x = centerX + Math.cos(s.angle) * s.distance;
            s.y = centerY + Math.sin(s.angle) * (s.distance * 0.6);

            // Repulsion from UFO cursor
            const dx = mouse.x - s.x;
            const dy = mouse.y - s.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const repelRadius = 110;

            let renderX = s.x;
            let renderY = s.y;

            if (dist < repelRadius) {
              const force = (repelRadius - dist) / repelRadius;
              const angle = Math.atan2(dy, dx);
              renderX -= Math.cos(angle) * force * 35;
              renderY -= Math.sin(angle) * force * 35;
            }

            const pulse = Math.sin(time * s.pulseSpeed * 10 + s.pulseOffset) * 0.3 + 1;
            const currentRadius = s.originalRadius * pulse;

            ctx.save();
            ctx.beginPath();
            ctx.arc(renderX, renderY, currentRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffffff';
            ctx.globalAlpha = dist < repelRadius ? 1 : s.alpha;
            ctx.fill();
            ctx.restore();
          });

          // Update & render ambient background shooting stars
          shootingStars.forEach((ss) => {
            ss.x += Math.cos(ss.angle) * ss.speed;
            ss.y += Math.sin(ss.angle) * ss.speed;
            ss.opacity -= 0.005;

            if (ss.opacity <= 0 || ss.x > width || ss.y > height) {
              ss.x = Math.random() * width;
              ss.y = 0;
              ss.opacity = Math.random() * 0.8 + 0.2;
            }

            ctx.save();
            ctx.beginPath();
            const tailX = ss.x - Math.cos(ss.angle) * ss.length;
            const tailY = ss.y - Math.sin(ss.angle) * ss.length;
            const grad = ctx.createLinearGradient(ss.x, ss.y, tailX, tailY);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            
            ctx.strokeStyle = grad;
            ctx.lineWidth = 1.5;
            ctx.moveTo(ss.x, ss.y);
            ctx.lineTo(tailX, tailY);
            ctx.stroke();
            ctx.restore();
          });

          animId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseleave', handleMouseLeave);
          cancelAnimationFrame(animId);
        };
      }, []);

      return <canvas ref={canvasRef} style={{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 1 }} />;
    }

    function UFOCursor() {

            cursorRef.current.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;

          <div className="ufo-beam" />

      );
    }

    /* =========================================================================
       ANIMATION PRIMITIVES
    ========================================================================= */
    function Reveal({ children, delay = 0, y = 40, style = {}, as = "div", className = "" }) {
      const [ref, visible] = useInView(0.12);
      const reduced = usePrefersReducedMotion();
      const Tag = as;
      return (
        <Tag
          ref={ref}
          className={className}
          style={{
            opacity: reduced ? 1 : visible ? 1 : 0,
            transform: reduced ? "none" : visible ? "translateY(0) scale(1)" : `translateY(${y}px) scale(0.92)`,
            filter: reduced ? "none" : visible ? "blur(0px)" : "blur(12px)",
            transition: reduced ? "none" : `all 1s cubic-bezier(0.16, 1, 0.3, 1) ${delay}s`,
            ...style,
          }}
        >
          {children}
        </Tag>
      );
    }

    ========================================================================= */
    function ProjectCard({ project, index, onImageClick }) {
      const cardRef = useRef(null);
      const [visible, setVisible] = useState(false);
      const reduced = usePrefersReducedMotion();
      const cat = CATEGORY[project.tag];
      const IconCmp = cat.icon;

      useEffect(() => {
        const el = cardRef.current;
        if (!el) return;
        const obs = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) { setVisible(true); obs.unobserve(el); }
        }, { threshold: 0.1 });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);

      const metricValue = useCountUp(project.metric ? project.metric.value : 0, visible && !!project.metric, 1400);

      const handleMove = useCallback((e) => {
        if (reduced) return;
        const el = cardRef.current;
        if (!el) return;
        const rect = el.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const px = x / rect.width;
        const py = y / rect.height;
        el.style.setProperty("--mx", `${x}px`);
        el.style.setProperty("--my", `${y}px`);
        el.style.transition = "transform .1s ease-out";
        el.style.transform = `perspective(1200px) rotateX(${(0.5 - py) * 8}deg) rotateY(${(px - 0.5) * 8}deg) translateY(-8px) scale(1.02)`;
      }, [reduced]);

      const handleLeave = useCallback(() => {
        const el = cardRef.current;
        if (!el) return;
        el.style.transition = "transform .6s cubic-bezier(.16,1,.3,1)";
        el.style.transform = "perspective(1200px) rotateX(0deg) rotateY(0deg) translateY(0) scale(1)";
      }, []);

      const baseStyle = {
        opacity: reduced ? 1 : visible ? 1 : 0,
        transform: reduced ? "none" : visible ? "translateY(0) scale(1)" : "translateY(40px) scale(0.92)",
        transitionProperty: "opacity, transform",
        transitionDuration: "1s",
        transitionTimingFunction: "cubic-bezier(.16,1,.3,1)",
        transitionDelay: `${(index % 3) * 0.15}s`,
      };

      return (
        <div ref={cardRef} onMouseMove={handleMove} onMouseLeave={handleLeave} className="project-card liquid-glass-clear" style={{ ...baseStyle, "--cat": cat.color }}>
          <div className="card-spotlight" />
          <div className="frame-wrap" style={{ "--cat": cat.color }}>

              {project.image ? (
                <>
                  <div className="frame-bar liquid-glass-sub">

                    <span className="dot" style={{ background: "#FEBC2E" }} />
                    <span className="dot" style={{ background: "#28C840" }} />

          .timeline-item.left li { padding-right: 18px; }
          .timeline-item.right li::before { content: '✨'; position: absolute; left: -5px; font-size: 12px; }
          .timeline-item.left li::before { content: '✨'; position: absolute; right: -5px; font-size: 12px; }
          
          @media screen and (max-width: 768px) {
            .timeline-center::after { left: 40px; }
            .timeline-item { width: 100%; padding-left: 90px; padding-right: 15px; }
            .timeline-item.left, .timeline-item.right { left: 0; text-align: left; }
            .timeline-item.left::after, .timeline-item.right::after { left: 30px; }
            .timeline-item.left .timeline-icon, .timeline-item.right .timeline-icon { left: 18px; right: auto; }
            .timeline-item.left li { padding-right: 0; padding-left: 18px; }
            .timeline-item.left li::before { left: -5px; right: auto; }
          }

          /* Certifications */
          .cert-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
          .cert-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 24px 28px; text-decoration: none; }
          .cert-icon-wrap { width: 50px; height: 50px; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: inset 0 2px 5px rgba(255,255,255,0.1); }
          .cert-content { flex: 1; }
          .cert-content h4 { margin: 0; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }
          .cert-content p { margin: 6px 0 0; font-size: 14px; color: rgba(255,255,255,0.6); font-weight: 600; }
          .cert-arrow { color: rgba(255,255,255,0.8); transition: transform 0.3s; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
          .cert-card:hover .cert-arrow { transform: translate(4px, -4px) scale(1.1); color: #fff; }

          /* Contact & Footer */
          .contact-card { padding: 60px; text-align: center; display: flex; flex-direction: column; align-items: center; }
          .contact-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 24px; }
          .footer-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 80px; padding-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 14.5px; color: rgba(255,255,255,0.5); font-weight: 600; }
          .footer-meta span { display: inline-flex; align-items: center; gap: 8px; }

          /* Lightbox */
          .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(30px); z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeIn .4s cubic-bezier(0.16, 1, 0.3, 1); }
          @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
          .lightbox-inner { max-width: 1000px; width: 100%; border-radius: 36px; overflow: hidden; padding: 12px; }
          .lightbox-inner img { width: 100%; display: block; border-radius: 24px; border: 1px solid rgba(255,255,255,0.15); }
          .lightbox-caption { display: flex; justify-content: space-between; align-items: center; padding: 24px 12px 12px; }
          .lightbox-caption p { margin: 0; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 18px; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
          .lightbox-caption button { border: none; color: #fff; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(255,255,255,0.1); border-radius: 50%; transition: all 0.3s; }
          .lightbox-caption button:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }
        `}</style>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Portfolio />);
  </script>
</body>
</html>
