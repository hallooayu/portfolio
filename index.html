          window.lucide.createIcons({
            root: iconRef.current,
            attrs: { width: size, height: size, color: color, class: className, "stroke-width": 2 }
          });
        }
      }, [name, size, color, className]);
      return <span ref={iconRef} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', ...style }} />;
    }

    /* =========================================================================
       HOOKS
    ========================================================================= */
    function usePrefersReducedMotion() {
      const [reduced, setReduced] = useState(false);
      useEffect(() => {
        const mq = window.matchMedia("(prefers-reduced-motion: reduce)");
        setReduced(mq.matches);
        const handler = () => setReduced(mq.matches);
        mq.addEventListener ? mq.addEventListener("change", handler) : mq.addListener(handler);
        return () => mq.removeEventListener ? mq.removeEventListener("change", handler) : mq.removeListener(handler);
      }, []);
      return reduced;
    }

    function useInView(threshold = 0.15) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) { setVisible(true); obs.unobserve(el); }
        }, { threshold });
        obs.observe(el);
        return () => obs.disconnect();
      }, [threshold]);
      return [ref, visible];
    }

    function useCountUp(target, active, duration = 1300) {
      const [value, setValue] = useState(0);
      useEffect(() => {
        if (!active) return;
        let raf;
        const start = performance.now();
        const tick = (now) => {
          const p = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - p, 3);
          setValue(target * eased);
          if (p < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => raf && cancelAnimationFrame(raf);
      }, [active, target, duration]);
      return value;
    }

    function useScrollProgress() {
      const [progress, setProgress] = useState(0);
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        let ticking = false;
        const onScroll = () => {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(() => {
            const doc = document.documentElement;
            const top = doc.scrollTop || document.body.scrollTop;
            const height = doc.scrollHeight - doc.clientHeight;
            setProgress(height > 0 ? (top / height) * 100 : 0);
            setScrolled(top > 8);
            ticking = false;
          });
        };
        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();
        return () => window.removeEventListener("scroll", onScroll);
      }, []);
      return { progress, scrolled };
    }

    /* =========================================================================
       ANIMATION PRIMITIVES
    ========================================================================= */
    function CustomCursor() {
      const cursorRef = useRef(null);
      const ringRef = useRef(null);
      
      useEffect(() => {
        const onMouseMove = (e) => {
          if (cursorRef.current && ringRef.current) {
            cursorRef.current.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
            ringRef.current.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
          }
        };
        const onMouseDown = () => ringRef.current?.classList.add('clicking');
        const onMouseUp = () => ringRef.current?.classList.remove('clicking');
        
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mouseup', onMouseUp);
        
        return () => {
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mousedown', onMouseDown);
          window.removeEventListener('mouseup', onMouseUp);
        };
      }, []);

      return (
        <>
          <div ref={cursorRef} className="custom-cursor-dot" />
          <div ref={ringRef} className="custom-cursor-ring" />
        </>
      );
    }

    function Reveal({ children, delay = 0, y = 30, style = {}, as = "div", className = "" }) {
      const [ref, visible] = useInView(0.12);
      const reduced = usePrefersReducedMotion();
      const Tag = as;
      return (
        <Tag
          ref={ref}
          className={className}
          style={{
            opacity: reduced ? 1 : visible ? 1 : 0,
            transform: reduced ? "none" : visible ? "translateY(0) scale(1)" : `translateY(${y}px) scale(0.96)`,
            filter: reduced ? "none" : visible ? "blur(0px)" : "blur(8px)",
            transition: reduced ? "none" : `all 0.8s cubic-bezier(0.16, 1, 0.3, 1) ${delay}s`,
            ...style,
          }}
        >
          {children}
        </Tag>
      );
    }

    function KineticHeading({ text }) {
      const words = text.split(" ");

            <span key={i} style={{ display: "inline-block", overflow: "hidden", paddingBottom: "0.12em", marginRight: "0.28em" }}>
              <span
                className="word-inner"
                style={{ display: "inline-block", animation: `wordUp .9s cubic-bezier(.16,1,.3,1) both`, animationDelay: `${0.15 + i * 0.09}s` }}
              >
                {w}
              </span>
            </span>
          ))}
        </span>
      );
    }

    function GradTag({ color, children }) {

          {children}
        </span>
      );
    }

    function StatCounter({ value, decimals = 0, prefix = "", suffix = "", label }) {
      const [ref, visible] = useInView(0.4);
      const n = useCountUp(value, visible);
      return (
        <div ref={ref} className="stat-counter">
          <div style={{ fontFamily: "'Unbounded', sans-serif", fontWeight: 700, fontSize: "clamp(26px,3.4vw,34px)", background: `linear-gradient(90deg, ${GRAD_A}, ${GRAD_B})`, WebkitBackgroundClip: "text", color: "transparent" }}>
            {prefix}{n.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals })}{suffix}
          </div>
          <div style={{ fontSize: 13, color: "#d9cce5", marginTop: 2 }}>{label}</div>
        </div>
      );
    }

    /* =========================================================================
       PROJECT CARD
    ========================================================================= */
    function ProjectCard({ project, index }) {
      const cardRef = useRef(null);
      const [visible, setVisible] = useState(false);
      const reduced = usePrefersReducedMotion();
      const cat = CATEGORY[project.tag];
      const IconCmp = cat.icon;

      useEffect(() => {
        const el = cardRef.current;
        if (!el) return;
        const obs = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) { setVisible(true); obs.unobserve(el); }
        }, { threshold: 0.1 });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);

      const metricValue = useCountUp(project.metric ? project.metric.value : 0, visible && !!project.metric, 1400);

      const handleMove = useCallback((e) => {
        if (reduced) return;
        const el = cardRef.current;
        if (!el) return;
        const rect = el.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const px = x / rect.width;
        const py = y / rect.height;
        el.style.setProperty("--mx", `${x}px`);
        el.style.setProperty("--my", `${y}px`);
        el.style.transition = "transform .08s linear";
        el.style.transform = `perspective(1000px) rotateX(${(0.5 - py) * 7}deg) rotateY(${(px - 0.5) * 7}deg) translateY(-8px) scale(1.02)`;
      }, [reduced]);

      const handleLeave = useCallback(() => {
        const el = cardRef.current;
        if (!el) return;
        el.style.transition = "transform .5s cubic-bezier(.16,1,.3,1)";
        el.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0) scale(1)";
      }, []);

      const baseStyle = {
        opacity: reduced ? 1 : visible ? 1 : 0,
        transform: reduced ? "none" : visible ? "translateY(0) scale(1)" : "translateY(30px) scale(0.95)",
        transitionProperty: "opacity, transform",
        transitionDuration: ".8s",
        transitionTimingFunction: "cubic-bezier(.16,1,.3,1)",
        transitionDelay: `${(index % 3) * 0.1}s`,
      };

      return (
        <div ref={cardRef} onMouseMove={handleMove} onMouseLeave={handleLeave} className="project-card" style={{ ...baseStyle, "--cat": cat.color }}>
          <div className="card-spotlight" />
          <div className="frame-wrap" style={{ "--cat": cat.color }}>
            <div className="frame-inner">
              {project.image ? (
                <>
                  <div className="frame-bar">
                    <span className="dot" style={{ background: "#FF5F57" }} />
                    <span className="dot" style={{ background: "#FEBC2E" }} />
                    <span className="dot" style={{ background: "#28C840" }} />
                  </div>
                  <img src={project.image} alt={project.title} loading="lazy" />
                </>
              ) : (
                <div className="locked-panel">
                  <Lock size={22} color="#F472B6" />
                  <span>Confidential dashboard</span>
                </div>
              )}
            </div>
          </div>
          <div style={{ padding: "20px 22px 22px", display: "flex", flexDirection: "column", gap: 12, flex: 1 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <GradTag color={cat.color}> <IconCmp size={13} /> {cat.label} </GradTag>
              {project.metric && (
                <span className="card-metric">
                  {project.metric.prefix}{metricValue.toLocaleString("en-US", { minimumFractionDigits: project.metric.decimals, maximumFractionDigits: project.metric.decimals })}{project.metric.suffix}
                </span>
              )}
            </div>
            <div>
              <h3 style={{ margin: 0, fontFamily: "'Unbounded'", fontWeight: 600, fontSize: 17, lineHeight: 1.35, color: "#FFF" }}>{project.title}</h3>
              <p style={{ margin: "4px 0 0", fontSize: 12.5, color: "#d9cce5" }}>{project.org}, {project.year}</p>
            </div>
            <p style={{ margin: 0, fontSize: 14, lineHeight: 1.65, color: "#e8dcf5" }}>{project.summary}</p>
            
            {project.metric && <p style={{ margin: "-6px 0 0", fontSize: 11.5, color: "#F472B6" }}>{project.metric.label}</p>}
            
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: "auto" }}>
              {project.tools.map((t) => <span key={t} className="tool-chip">{t}</span>)}
            </div>
          </div>
        </div>
      );
    }
