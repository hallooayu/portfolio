    function usePrefersReducedMotion() {
      const [reduced, setReduced] = useState(false);
      useEffect(() => {
        const mq = window.matchMedia("(prefers-reduced-motion: reduce)");
        setReduced(mq.matches);
        const handler = () => setReduced(mq.matches);
        mq.addEventListener ? mq.addEventListener("change", handler) : mq.addListener(handler);
        return () => mq.removeEventListener ? mq.removeEventListener("change", handler) : mq.removeListener(handler);
      }, []);
      return reduced;
    }

    function useInView(threshold = 0.15) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) { setVisible(true); obs.unobserve(el); }
        }, { threshold });
        obs.observe(el);
        return () => obs.disconnect();
      }, [threshold]);
      return [ref, visible];
    }

    function useCountUp(target, active, duration = 1300) {
      const [value, setValue] = useState(0);
      useEffect(() => {
        if (!active) return;
        let raf;
        const start = performance.now();
        const tick = (now) => {
          const p = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - p, 3);
          setValue(target * eased);
          if (p < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => raf && cancelAnimationFrame(raf);
      }, [active, target, duration]);
      return value;
    }

    function useScrollProgress() {
      const [progress, setProgress] = useState(0);
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        let ticking = false;
        const onScroll = () => {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(() => {
            const doc = document.documentElement;
            const top = doc.scrollTop || document.body.scrollTop;
            const height = doc.scrollHeight - doc.clientHeight;
            setProgress(height > 0 ? (top / height) * 100 : 0);
            setScrolled(top > 8);
            ticking = false;
          });
        };
        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();
        return () => window.removeEventListener("scroll", onScroll);
      }, []);
      return { progress, scrolled };
    }

    /* =========================================================================
       VIBRANT INTERACTIVE GALAXY STAR CANVAS COMPONENT
    ========================================================================= */
    function GalaxyStarsCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        let mouse = { x: -1000, y: -1000 };
        const handleMouseMove = (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        };
        const handleMouseLeave = () => {
          mouse.x = -1000;
          mouse.y = -1000;
        };
        window.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseleave', handleMouseLeave);

        // Generate bigger, vibrant galaxy stars & nebulas
        const colors = ['#38bdf8', '#818cf8', '#f472b6', '#2dd4bf', '#fbbf24', '#ffffff'];
        const starCount = Math.floor((width * height) / 12000) + 70; // Plenty of big stars
        const stars = [];

        for (let i = 0; i < starCount; i++) {
          const baseRadius = Math.random() * 3.5 + 1.2; // Much bigger stars!
          stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            baseX: Math.random() * width,
            baseY: Math.random() * height,
            radius: baseRadius,
            originalRadius: baseRadius,
            color: colors[Math.floor(Math.random() * colors.length)],
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4,
            angle: Math.random() * Math.PI * 2,
            speed: Math.random() * 0.02 + 0.005,
            pulseSpeed: Math.random() * 0.05 + 0.02,
            pulseOffset: Math.random() * 10
          });
        }

        let time = 0;
        const render = () => {
          time += 0.03;
          ctx.clearRect(0, 0, width, height);

          stars.forEach((s) => {
            // Drift naturally
            s.x += s.vx;
            s.y += s.vy;

            // Screen wrap
            if (s.x < 0) s.x = width;
            if (s.x > width) s.x = 0;
            if (s.y < 0) s.y = height;
            if (s.y > height) s.y = 0;

            // Cursor Repulsion & Dynamic Hit Reaction (Move away when cursor is near)
            const dx = mouse.x - s.x;
            const dy = mouse.y - s.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const repelRadius = 140;

            if (dist < repelRadius) {
              const force = (repelRadius - dist) / repelRadius;
              const angle = Math.atan2(dy, dx);
              s.x -= Math.cos(angle) * force * 7;
              s.y -= Math.sin(angle) * force * 7;
            }

            // Pulsing vibrant glow effect
            const pulse = Math.sin(time * s.pulseSpeed * 15 + s.pulseOffset) * 0.5 + 1;
            const currentRadius = s.originalRadius * pulse;

            ctx.save();
            ctx.beginPath();
            ctx.arc(s.x, s.y, currentRadius, 0, Math.PI * 2);
            ctx.fillStyle = s.color;
            ctx.shadowBlur = 18;
            ctx.shadowColor = s.color;
            ctx.globalAlpha = dist < repelRadius ? 1 : 0.85;
            ctx.fill();
            ctx.restore();
          });

          animId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseleave', handleMouseLeave);
          cancelAnimationFrame(animId);
        };
      }, []);

      return <canvas ref={canvasRef} style={{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 1 }} />;
    }

    function CustomCursor() {
      const cursorRef = useRef(null);
      const ringRef = useRef(null);
      
      useEffect(() => {
        const onMouseMove = (e) => {
          if (cursorRef.current && ringRef.current) {
            cursorRef.current.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
            ringRef.current.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
          }
        };
        const onMouseDown = () => ringRef.current?.classList.add('clicking');
        const onMouseUp = () => ringRef.current?.classList.remove('clicking');
        
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mouseup', onMouseUp);
        
        return () => {
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mousedown', onMouseDown);
          window.removeEventListener('mouseup', onMouseUp);
        };
      }, []);

      return (
        <>
          <div ref={cursorRef} className="custom-cursor-dot" />
          <div ref={ringRef} className="custom-cursor-ring" />
        </>
      );
    }

    function Reveal({ children, delay = 0, y = 40, style = {}, as = "div", className = "" }) {
      const [ref, visible] = useInView(0.12);
      const reduced = usePrefersReducedMotion();
      const Tag = as;
      return (
        <Tag
          ref={ref}
          className={className}
          style={{
            opacity: reduced ? 1 : visible ? 1 : 0,
            transform: reduced ? "none" : visible ? "translateY(0) scale(1)" : `translateY(${y}px) scale(0.92)`,
            filter: reduced ? "none" : visible ? "blur(0px)" : "blur(12px)",
            transition: reduced ? "none" : `all 1s cubic-bezier(0.16, 1, 0.3, 1) ${delay}s`,
            ...style,
          }}
        >
          {children}
        </Tag>
      );
    }

    ========================================================================= */
    function ProjectCard({ project, index, onImageClick }) {
      const cardRef = useRef(null);
      const [visible, setVisible] = useState(false);
      const reduced = usePrefersReducedMotion();
      const cat = CATEGORY[project.tag];
      const IconCmp = cat.icon;

      useEffect(() => {
        const el = cardRef.current;
        if (!el) return;
        const obs = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) { setVisible(true); obs.unobserve(el); }
        }, { threshold: 0.1 });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);

      const metricValue = useCountUp(project.metric ? project.metric.value : 0, visible && !!project.metric, 1400);

      const handleMove = useCallback((e) => {
        if (reduced) return;
        const el = cardRef.current;
        if (!el) return;
        const rect = el.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const px = x / rect.width;
        const py = y / rect.height;
        el.style.setProperty("--mx", `${x}px`);
        el.style.setProperty("--my", `${y}px`);
        el.style.transition = "transform .1s ease-out";
        el.style.transform = `perspective(1200px) rotateX(${(0.5 - py) * 8}deg) rotateY(${(px - 0.5) * 8}deg) translateY(-8px) scale(1.02)`;
      }, [reduced]);

      const handleLeave = useCallback(() => {
        const el = cardRef.current;
        if (!el) return;
        el.style.transition = "transform .6s cubic-bezier(.16,1,.3,1)";
        el.style.transform = "perspective(1200px) rotateX(0deg) rotateY(0deg) translateY(0) scale(1)";
      }, []);

      const baseStyle = {
        opacity: reduced ? 1 : visible ? 1 : 0,
        transform: reduced ? "none" : visible ? "translateY(0) scale(1)" : "translateY(40px) scale(0.92)",
        transitionProperty: "opacity, transform",
        transitionDuration: "1s",
        transitionTimingFunction: "cubic-bezier(.16,1,.3,1)",
        transitionDelay: `${(index % 3) * 0.15}s`,
      };

      return (

          .frame-bar { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); border-radius: 0; box-shadow: none; border-left: none; border-top: none; border-right: none; }
          .frame-bar .dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 1px 2px rgba(255,255,255,0.3); }
          .frame-inner img { width: 100%; display: block; transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); aspect-ratio: 16/9; object-fit: cover; }
          .project-card:hover .frame-inner img { transform: scale(1.08); }
          .project-card-content { padding: 20px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
          .cat-tag { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: 13.5px; font-weight: 800; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }
          .card-metric { font-family: 'Unbounded'; font-weight: 800; font-size: 16px; color: #fff; padding: 8px 16px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
          .project-card-content h3 { margin: 0; font-family: 'Unbounded'; font-weight: 700; font-size: 20px; line-height: 1.4; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.2); }
          .project-org { margin: -6px 0 0; font-size: 14px; color: rgba(255,255,255,0.7); font-weight: 700; }
          .project-summary { margin: 0; font-size: 15px; line-height: 1.7; color: rgba(255,255,255,0.85); }
          .tool-chip { font-size: 12.5px; font-weight: 700; padding: 8px 18px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
          
          .project-links-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; paddingTop: 16px; border-top: 1px solid rgba(255,255,255,0.1); }
          .project-ext-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #fff; background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 999px; text-decoration: none; border: 1px solid rgba(255,255,255,0.2); transition: all 0.3s; text-shadow: 0 1px 2px rgba(0,0,0,0.2); box-shadow: inset 0 1px 2px rgba(255,255,255,0.05); }
          .project-ext-link:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); }
          
          .locked-panel { padding: 80px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(0,0,0,0.4); text-align: center; }
          .locked-panel span { font-family: 'Unbounded'; font-weight: 700; font-size: 15px; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.3); }

          /* Timeline */
          .timeline-center { position: relative; max-width: 960px; margin: 0 auto; padding: 40px 0; }
          .timeline-center::after { content: ''; position: absolute; width: 4px; background: rgba(255,255,255,0.15); top: 0; bottom: 0; left: 50%; margin-left: -2px; border-radius: 2px; box-shadow: 0 0 15px rgba(255,255,255,0.1); }
          .timeline-item { padding: 10px 50px; position: relative; width: 50%; }
          .timeline-item.left { left: 0; text-align: right; }
          .timeline-item.right { left: 50%; text-align: left; }
          .timeline-content { padding: 32px; position: relative; border-radius: 32px; }
          .timeline-item::after { content: ''; position: absolute; width: 28px; height: 28px; right: -14px; background: rgba(255,255,255,0.9); border: 6px solid #38bdf8; top: 40px; border-radius: 50%; z-index: 2; box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
          .timeline-item.right::after { left: -14px; }
          .timeline-icon { position: absolute; top: -20px; background: linear-gradient(135deg, #38bdf8, #2dd4bf); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(45, 212, 191, 0.3), inset 0 2px 5px rgba(255,255,255,0.4); border: 2px solid white; z-index: 3; }
          .timeline-item.left .timeline-icon { right: -60px; }
          .timeline-item.right .timeline-icon { left: -60px; }
          .timeline-content h3 { margin: 0; font-family: 'Unbounded'; font-weight: 700; font-size: 19px; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.2); }
          .timeline-content .exp-org { margin: 8px 0 20px; font-size: 14.5px; color: #e0f2fe; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
          .timeline-content ul { margin: 0; padding: 0; list-style: none; font-size: 15px; line-height: 1.7; color: rgba(255,255,255,0.85); }
          .timeline-content li { margin-bottom: 10px; position: relative; }
          .timeline-item.right li { padding-left: 18px; }
          .timeline-item.left li { padding-right: 18px; }
          .timeline-item.right li::before { content: '✨'; position: absolute; left: -5px; font-size: 12px; }
          .timeline-item.left li::before { content: '✨'; position: absolute; right: -5px; font-size: 12px; }
          
          @media screen and (max-width: 768px) {
            .timeline-center::after { left: 40px; }
            .timeline-item { width: 100%; padding-left: 90px; padding-right: 15px; }
            .timeline-item.left, .timeline-item.right { left: 0; text-align: left; }
            .timeline-item.left::after, .timeline-item.right::after { left: 26px; }
            .timeline-item.left .timeline-icon, .timeline-item.right .timeline-icon { left: 18px; right: auto; }
            .timeline-item.left li { padding-right: 0; padding-left: 18px; }
            .timeline-item.left li::before { left: -5px; right: auto; }
          }

          /* Certifications */
          .cert-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
          .cert-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 24px 28px; text-decoration: none; }
          .cert-icon-wrap { width: 50px; height: 50px; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: inset 0 2px 5px rgba(255,255,255,0.1); }
          .cert-content { flex: 1; }
          .cert-content h4 { margin: 0; font-family: 'Unbounded'; font-weight: 700; font-size: 16px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
          .cert-content p { margin: 6px 0 0; font-size: 14px; color: rgba(255,255,255,0.7); font-weight: 600; }
          .cert-arrow { color: #fff; transition: transform 0.3s; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
          .cert-card:hover .cert-arrow { transform: translate(4px, -4px) scale(1.1); }

          /* Skills */
          .skills-groups { display: flex; flex-direction: column; gap: 40px; align-items: center; }
          .skill-group { padding: 40px; width: 100%; max-width: 860px; text-align: center; }
          .skill-group h3 { margin: 0 0 28px; font-family: 'Unbounded'; font-weight: 800; font-size: 20px; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.2); }
          .chip-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
          .skill-chip { font-weight: 700; font-size: 15px; padding: 14px 26px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }

          /* Contact & Footer */
          .contact-card { padding: 60px; text-align: center; display: flex; flex-direction: column; align-items: center; }
          .contact-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 24px; }
          .footer-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 80px; padding-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 14.5px; color: rgba(255,255,255,0.6); font-weight: 600; }
          .footer-meta span { display: inline-flex; align-items: center; gap: 8px; }

          /* Lightbox */
          .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(30px); z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeIn .4s cubic-bezier(0.16, 1, 0.3, 1); }
          @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
          .lightbox-inner { max-width: 1000px; width: 100%; border-radius: 36px; overflow: hidden; padding: 12px; }
          .lightbox-inner img { width: 100%; display: block; border-radius: 24px; border: 1px solid rgba(255,255,255,0.15); }
          .lightbox-caption { display: flex; justify-content: space-between; align-items: center; padding: 24px 12px 12px; }
          .lightbox-caption p { margin: 0; font-family: 'Unbounded'; font-weight: 700; font-size: 18px; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.3); }
          .lightbox-caption button { border: none; color: #fff; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
          
          /* Custom Navigation Dock Integration */
          .wrapper.dock-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
          }
          .liquidGlass-wrapper.dock {
            position: relative;
            border-radius: 32px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.1);
          }
          .liquidGlass-effect {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px) url(#glass-distortion);
            -webkit-backdrop-filter: blur(25px); /* Safari fallback */
            z-index: 0;
          }
          .liquidGlass-tint {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.02) 100%);
            z-index: 1;
            pointer-events: none;
          }
          .liquidGlass-shine {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(to bottom, rgba(255,255,255,0.3) 0%, transparent 50%);
            z-index: 2;
            pointer-events: none;
          }
          .liquidGlass-text {
            position: relative;
            z-index: 3;
          }
          .liquidGlass-text .dock-inner {
            display: flex;
            gap: 16px;
            align-items: flex-end;
            height: 60px;
          }
          .app-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.2, 0, 0, 1.2);
            transform-origin: bottom center;
            will-change: transform, width, height;
            -webkit-box-reflect: below 4px linear-gradient(transparent, rgba(0,0,0,0.2));
            box-shadow: 0 4px 10px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.2);
          }
          .app-icon:hover {
            transform: scale(1.4) translateY(-10px);
            margin: 0 12px;
            box-shadow: 0 12px 20px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.4);
            z-index: 10;
          }
          
          @media (max-width: 768px) {
            .wrapper.dock-container { bottom: 16px; }
            .app-icon { width: 44px; height: 44px; border-radius: 12px; }
            .liquidGlass-text .dock-inner { height: 48px; gap: 10px; }
          }
        `}</style>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Portfolio />);
  </script>
